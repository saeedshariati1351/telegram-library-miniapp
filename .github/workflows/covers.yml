name: دانلود جلد کتاب‌ها
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'تعداد کتاب برای آزمایش (۰ = همه)'
        default: '0'
  push:
    branches: [main]
    paths: ['tools/scrape_covers.py', 'tools/covers_debug.txt', 'tools/covers_limit.txt', '.github/workflows/covers.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: covers
  cancel-in-progress: false
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: scrape
        id: scrape
        env:
          BUDGET_MIN: '330'
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          export LIMIT="${INPUT_LIMIT:-$(cat tools/covers_limit.txt 2>/dev/null || echo 0)}"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          git config user.name "library-covers-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python tools/scrape_covers.py
      - name: continue if unfinished
        if: steps.scrape.outputs.left != '0' && steps.scrape.outputs.left != '' && steps.scrape.outputs.limit == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run covers.yml --ref main
